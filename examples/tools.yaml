# 示例工具定义。导入：onyx tools import examples/tools.yaml
# side_effect 必须显式标注：沙箱据此决定是否需要审批，未标注会被审计判为 error。
tools:
  - name: get_weather
    description: 查询指定城市的当前天气，包括温度、天气状况与风力。仅在用户询问实时天气时使用。
    kind: python_fn
    side_effect: network
    impl_ref: onyx.tools.builtin.weather:get_weather
    timeout_ms: 8000
    owner: platform
    tags: [demo, network]
    parameters:
      type: object
      properties:
        city:
          type: string
          description: 城市名称，使用中文或英文均可，例如「北京」或「Beijing」。
        unit:
          type: string
          enum: [celsius, fahrenheit]
          description: 温度单位。默认摄氏度；用户明确要求华氏度时才传 fahrenheit。
      required: [city]
      additionalProperties: false
    examples:
      - instruction: 北京现在天气怎么样？
        expect:
          name: get_weather
          arguments: { city: 北京 }

  - name: calculator
    description: 计算一个数学表达式的值，支持四则运算、括号与常见函数。用于任何需要精确算术的场合。
    kind: python_fn
    side_effect: read
    impl_ref: onyx.tools.builtin.calculator:calculate
    timeout_ms: 2000
    tags: [demo, pure]
    parameters:
      type: object
      properties:
        expr:
          type: string
          description: 待求值的数学表达式，例如 "(3 + 5) * 12"。不要包含赋值或函数定义。
      required: [expr]
      additionalProperties: false
    examples:
      - instruction: 帮我算 (3+5)*12
        expect:
          name: calculator
          arguments: { expr: "(3+5)*12" }

  - name: db_query
    description: 在只读副本上执行一条 SELECT 查询并返回结果行。禁止执行任何写操作或 DDL。
    kind: python_fn
    side_effect: read
    impl_ref: onyx.tools.builtin.db:query
    timeout_ms: 15000
    owner: data
    tags: [demo, data]
    parameters:
      type: object
      properties:
        sql:
          type: string
          description: 要执行的 SELECT 语句。必须是只读查询，不允许 INSERT/UPDATE/DELETE/DROP。
        limit:
          type: integer
          description: 返回行数上限，默认 100，最大 1000。用于避免一次性拉取过多数据。
      required: [sql]
      additionalProperties: false
    examples:
      - instruction: 查一下 3 月的订单总数
        expect:
          name: db_query
          arguments: { sql: "SELECT COUNT(*) FROM orders WHERE month = 3" }

  # constants 是「定义级、模型不可覆盖」的可信参数：它不出现在 properties 里，
  # 所以模型无法通过多写一个字段把 root 改成 /。若同名出现在 schema 中，
  # python_fn 执行器会直接报 error（constant_exposed），而不是静默覆盖。
  - name: fs_read
    description: 读取项目内一个文本文件的内容。只能读 root 目录之下的文件，越界会被拒绝。
    kind: python_fn
    side_effect: read
    impl_ref: onyx.tools.builtin.fs_read:read_file
    timeout_ms: 3000
    owner: platform
    tags: [demo, fs]
    constants:
      root: ./examples
    parameters:
      type: object
      properties:
        path:
          type: string
          description: 相对 root 的文件路径，例如「tools.yaml」。不接受绝对路径或 ../ 越界。
        max_bytes:
          type: integer
          description: 最多返回多少字节，默认 262144。超出会被截断并在结果里标 truncated。
      required: [path]
      additionalProperties: false
    examples:
      - instruction: 把 tools.yaml 读出来看看
        expect:
          name: fs_read
          arguments: { path: tools.yaml }

  # http 类工具不需要写 Python：端点写死在定义里（人工审核过），
  # 模型给的参数只能进 query 或 body，因此无法把请求指向别的主机。
  - name: http_demo
    description: 演示 http 执行器的定义写法。真实部署时把 url 换成你自己的服务端点。
    kind: http
    side_effect: network
    timeout_ms: 8000
    owner: platform
    tags: [demo, http]
    http:
      url: http://127.0.0.1:9/health
      method: GET
      body: query
      timeout_ms: 5000
    parameters:
      type: object
      properties:
        verbose:
          type: boolean
          description: 是否返回详细健康信息。默认 false，只在排查时才需要打开。
      required: []
      additionalProperties: false
    examples:
      - instruction: 检查一下服务健康状态
        expect:
          name: http_demo
          arguments: { verbose: false }
