[project]
name = "onyx-example-provider"
version = "0.1.0"
description = "Onyx 扩展点样板：外部 provider 插件（onyx.providers）"
requires-python = ">=3.12"
# 不声明 onyx 依赖：装插件时不该去索引里找一个同名第三方包。
# 插件跑在 onyx 自己的环境里，import 得到就够了。
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["example_provider"]

[project.entry-points."onyx.providers"]
echo = "example_provider.provider:EchoProvider"
